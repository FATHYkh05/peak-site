<!-- ================= BMI ================= -->
<section class="section">
  <div class="container bmi-grid">
    <div>
      <span class="tag reveal"><i class="dot"></i><span data-i18n="bmi.tag"></span></span>
      <h2 class="reveal" style="--d:.08s" data-i18n-html="bmi.title"></h2>
      <p class="muted reveal" style="--d:.14s" data-i18n="bmi.sub"></p>
    </div>
    <div class="card bmi reveal" style="--d:.1s">
      <form id="bmiForm" novalidate>
        <div class="row2">
          <label class="field"><span data-i18n="bmi.h"></span><input id="bmiH" type="number" inputmode="decimal" min="100" max="250" placeholder="175"></label>
          <label class="field"><span data-i18n="bmi.w"></span><input id="bmiW" type="number" inputmode="decimal" min="30" max="300" placeholder="80"></label>
        </div>
        <button class="btn btn-primary" type="submit" data-i18n="bmi.calc"></button>
        <small class="err" id="bmiErr"></small>
      </form>
      <div class="bmi-result" id="bmiResult" hidden>
        <div class="bmi-top"><span class="muted" data-i18n="bmi.label"></span><b id="bmiVal">0</b></div>
        <div class="gauge"><i id="bmiMarker"></i></div>
        <div class="bmi-cat" id="bmiCat"></div>

<!-- ================= BOOKING ================= -->
<section class="section book" id="book">
  <div class="book-bg" aria-hidden="true"><span class="blob b1"></span></div>
  <div class="container book-grid">
    <div>
      <span class="tag reveal"><i class="dot"></i><span data-i18n="book.tag"></span></span>
      <h2 class="reveal" style="--d:.08s" data-i18n-html="book.title"></h2>
      <p class="muted reveal" style="--d:.14s" data-i18n="book.sub"></p>
      <ul class="ticks big reveal" style="--d:.2s">
        <li><svg width="22" height="22"><use href="#i-check"/></svg><span data-i18n="book.i1"></span></li>
        <li><svg width="22" height="22"><use href="#i-check"/></svg><span data-i18n="book.i2"></span></li>
        <li><svg width="22" height="22"><use href="#i-check"/></svg><span data-i18n="book.i3"></span></li>
      </ul>
    </div>

    <form class="card form reveal" id="bookForm" novalidate style="--d:.1s">
      <label class="field"><span data-i18n="f.name"></span><input id="fName" name="name" type="text" autocomplete="name"><small class="err" data-err="name"></small></label>
      <label class="field"><span data-i18n="f.phone"></span><input id="fPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr"><small class="err" data-err="phone"></small></label>
      <div class="row2">
        <label class="field"><span data-i18n="f.goal"></span>
          <select id="fGoal" name="goal">
            <option value="g1" data-i18n="prog.1.t"></option>
            <option value="g2" data-i18n="prog.2.t"></option>
            <option value="g3" data-i18n="prog.3.t"></option>
          </select>
        </label>
        <label class="field"><span data-i18n="f.plan"></span>
          <select id="fPlan" name="plan">
            <option value="plan1" data-i18n="plan1.n"></option>
            <option value="plan2" data-i18n="plan2.n" selected></option>
            <option value="plan3" data-i18n="plan3.n"></option>
          </select>
        </label>
      </div>
      <button class="btn btn-primary btn-block" type="submit"><svg width="20" height="20"><use href="#i-wa"/></svg><span data-i18n="f.send"></span></button>
